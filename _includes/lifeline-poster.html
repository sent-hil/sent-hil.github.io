  /* Poster-specific rules only. Everything else -- colour, type, dark mode --
     comes from the site's own tokens, so the chart follows the theme.
     Scoped to .lifeline so these generic names cannot leak into a post. */
  .lifeline{margin:1.6rem 0}
  .lifeline .chart{width:100%;overflow-x:auto}
  .lifeline .chart svg{display:block;width:100%;height:auto;min-width:44rem}
  .lifeline .grid{stroke:var(--rule);stroke-width:1}
  .lifeline .ax{font-family:var(--mono);font-size:12px;fill:var(--faint)}
  .lifeline .life-bar{fill:var(--ink)}
  .lifeline .life-x{stroke:var(--muted);stroke-width:1.25;fill:none}
  .lifeline .life-arc{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;fill:none}
  .lifeline .life-head{fill:var(--ink)}
  .lifeline .life-arclab{font-family:var(--mono);font-size:11px;fill:var(--muted)}
  .lifeline .life-name{font-family:var(--mono);font-size:12.5px;fill:var(--ink)}
  .lifeline .life-status{font-family:var(--mono);font-size:12.5px;fill:var(--ink)}
  .lifeline .life-status.dim{fill:var(--faint)}
  .lifeline .legend{
    display:flex;flex-wrap:wrap;gap:.5rem 2rem;margin-top:.9rem;
    font-family:var(--mono);font-size:var(--xs);color:var(--muted);
  }
  .lifeline .legend span{display:inline-flex;align-items:center;gap:.5rem}
  .lifeline .legend svg{flex:0 0 auto}
  .lifeline figcaption{
    margin-top:.9rem;font-family:var(--mono);font-size:var(--xs);color:var(--faint);
  }
